name: Commit message validation

on:
  pull_request:
    branches:
      - dev
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  validate:
    name: Validate commits
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out pull request history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate Conventional Commit messages
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = 'Stop'

          $commitIds = @(git rev-list --reverse --no-merges "$env:BASE_SHA..$env:HEAD_SHA")
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to determine the commits in this pull request.'
          }
          if ($commitIds.Count -eq 0) {
            throw 'No non-merge commits were found in this pull request.'
          }

          $messages = @()
          $labels = @()
          foreach ($commitId in $commitIds) {
            $messageLines = @(git show --no-patch --format=%B $commitId)
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to read commit $commitId."
            }
            $messages += ,($messageLines -join [Environment]::NewLine)
            $labels += $commitId.Substring(0, 12)
          }

          & .\scripts\validate-commit-messages.ps1 `
            -Message $messages `
            -Label $labels `
            -GitHubActions
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
